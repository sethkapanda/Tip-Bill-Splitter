<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip & Bill Splitter</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }

        .card {
            background: #fff;
            width: 100%;
            max-width: 360px;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.4rem;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        #calculate {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 4px;
            background: #2b7a4b;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }

        #calculate:hover {
            background: #226139;
        }

        #error {
            color: #c0392b;
            min-height: 1.2em;
            margin: 12px 0 0;
            font-size: 0.9rem;
        }

        #results p {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Tip & Bill Splitter</h1>

        <label for="bill">Bill amount (R)</label>
        <input type="number" id="bill" placeholder="e.g. 500">

        <label for="tip">Tip percentage (%)</label>
        <input type="number" id="tip" placeholder="e.g. 10">

        <label for="people">Number of people</label>
        <input type="number" id="people" placeholder="e.g. 4">



        <button id="calculate">Calculate</button>

        <p id="error"></p>

        <div id="results">
            <p>Tip: <span id="tipAmount"></span></p>
            <p>Total: <span id="totalAmount"></span></p>
            <p>Per person: <span id="perPerson"></span></p>
        </div>
    </div>

    <script>
    // Inputs
    const billInput = document.getElementById("bill");
    const tipInput = document.getElementById("tip");
    const peopleInput = document.getElementById("people");

    // Outputs
    const tipOutput = document.getElementById("tipAmount");
    const totalOutput = document.getElementById("totalAmount");
    const perPersonOutput = document.getElementById("perPerson");
    const errorOutput = document.getElementById("error");

    const displayValues = () => {
        // Convert strings to numbers once, up front
        const bill = parseFloat(billInput.value);
        const tipPercent = parseFloat(tipInput.value);
        const people = parseInt(peopleInput.value, 10);

        // Validate before calculating
        if (isNaN(bill) || bill <= 0 || isNaN(tipPercent) || tipPercent < 0 || isNaN(people) || people < 1) {
            errorOutput.textContent = "Please enter a bill above 0, a tip of 0 or more, and at least 1 person.";
            tipOutput.textContent = "";
            totalOutput.textContent = "";
            perPersonOutput.textContent = "";
            return;
        }
        errorOutput.textContent = "";

        // Calculate
        const tip = bill * (tipPercent / 100);
        const total = bill + tip;
        const perPerson = total / people;

        // Display on the page
        tipOutput.textContent = `R${tip.toFixed(2)}`;
        totalOutput.textContent = `R${total.toFixed(2)}`;
        perPersonOutput.textContent = `R${perPerson.toFixed(2)}`;
    };

    document.getElementById("calculate").addEventListener("click", displayValues);
</script>

</body>
</html>
